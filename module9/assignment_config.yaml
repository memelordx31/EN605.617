# assignment_config.yaml
#
# Consumed by run_assignments.sh (EN605.617/assignment_build_execution).
# Place at the root of the git project, alongside .git.
#
# Layout expected:
#   <project root>/
#     assignment_config.yaml
#     auth.txt       <- LANL cyber1 auth log (or auth.txt.gz)       } optional: run.sh
#     redteam.txt    <- LANL cyber1 red-team log (or redteam.txt.gz) } falls back to
#     src/                                                          } synthetic samples
#       auth_streams_libs.cu
#       build.sh
#       run.sh

folder: src

# One build: compile with -O2 for compute capability 7.5, linking cuRAND.
# (sm_60 or newer is required for the double-precision atomicAdd.)
# -> ./build.sh -O 2 --arch sm_75
build:
  O: 2
  arch: sm_75

# Several independent runs. Each one scores dataset A (normal) and
# dataset B (red team) on two streams vs. one stream, computes Thrust
# statistics (reduce / sort / count_if), and runs a cuRAND Monte Carlo
# bootstrap test of whether B is more anomalous than the pooled traffic.
# blocks * threads must be >= BOTH sizeA and sizeB.
run:
  # 1) Configuration from the source header
  #    -> ./run.sh --sizeA 1048576 --sizeB 65536 --threads 256 --blocks 4096
  #               --mc 16384 --sample 512
  - sizeA: 1048576
    sizeB: 65536
    threads: 256
    blocks: 4096
    mc: 16384
    sample: 512
  # 2) Smaller dataset A (131072 records), same Monte Carlo settings
  - sizeA: 131072
    sizeB: 65536
    threads: 256
    blocks: 512
    mc: 16384
    sample: 512
  # 3) Lighter Monte Carlo: fewer replicates and draws per replicate
  - sizeA: 1048576
    sizeB: 65536
    threads: 256
    blocks: 4096
    mc: 4096
    sample: 128
  # 4) Header configuration with a different seed (checks the p-value is
  #    stable across random streams, not an artifact of seed 12345)
  - sizeA: 1048576
    sizeB: 65536
    threads: 256
    blocks: 4096
    mc: 16384
    sample: 512
    seed: 2026
